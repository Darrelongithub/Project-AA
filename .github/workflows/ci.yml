# The gates this repo actually lives by — typecheck, the full suite, the scenario
# simulation, stress, and a compile check — run on every push and pull request, so that
# "green" means the checked-in commands passed rather than that someone remembered to run
# them. Each step is a command from README.md verbatim; no lint or format policy is
# introduced (there is still no ESLint config, by choice — see BUGS.md PROD-12).
#
# better-sqlite3, sharp and canvas ship prebuilds for ubuntu-latest; the toolchain below
# is the same list scripts/setup-linux.sh installs, so a source build can still succeed and
# CI prepares the box the way a developer's Linux machine is prepared.
#
# An earlier workflow of this shape existed on arena/01a0e73c-project-aa ("Audit G (C9)")
# and passed there, but that branch never reached main, so the file was lost with it and
# main has been running with no CI since. This version keeps its triggers and job name and
# adds what the years of migration and log-forgery defects in BUGS.md showed was missing.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · simulate · stress · build · boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the whitespace step can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # engines.node is >=22.13.0 (pdf.js 6 requires it); quoted so YAML does not
          # read it as the number 22 and hand setup-node "22.0".
          node-version: "22.13"
          cache: npm

      - name: Toolchain for native-module source builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Simulate
        run: npm run simulate

      - name: Stress
        run: npm run stress

      - name: Build
        run: npm run build

      # The boot gate is the one that has actually bitten: the crash that shipped twice was a
      # boot-time migrate() aborting on a real database file, which no in-memory test can show.
      # So CI runs the compiled server a deployment would run, against a fresh file, and fails
      # on a migration error — and, for PROD-14, on any log line that is not its own
      # self-describing event.
      - name: Compiled server boots on a fresh database and frames its own log
        run: |
          work="$(mktemp -d)"
          # --no-warnings: Node's own runtime diagnostics are written to stderr beside the
          # app's, and they are not framed log events. Suppressing them at the source keeps
          # the assertion below strict — every line in this file must be one the logger
          # emitted — instead of teaching the gate to forgive a list of noise patterns.
          DB_PATH="$work/ci.sqlite" PORT=8080 MODE=mock node --no-warnings dist/src/cli/serve.js > "$work/serve.log" 2>&1 &
          pid=$!
          answer=""
          for _ in $(seq 1 60); do
            sleep 1
            answer="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login || true)"
            [ -n "$answer" ] && [ "$answer" != "000" ] && break
          done
          kill "$pid" 2>/dev/null || true
          if [ -z "$answer" ] || [ "$answer" = "000" ]; then
            echo "::error::the server never answered on :8080"
            cat "$work/serve.log"
            exit 1
          fi
          if grep -qE 'no such table|error in view|SqliteError|Migration failed' "$work/serve.log"; then
            echo "::error::boot-time migration reported a failure"
            cat "$work/serve.log"
            exit 1
          fi
          unframed="$(grep -vE '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z\] (DEBUG|INFO|WARN|ERROR) ' "$work/serve.log" | head -3 | tr '\n' '|')"
          if [ -n "$unframed" ]; then
            # The offending text goes in the annotation, not only the log: annotations are
            # readable through the checks API when the raw run log is not, so a failure here
            # is diagnosable from the outside instead of turning into a guess.
            echo "::error::process log contains a line that is not a prefixed event (PROD-14): ${unframed}"
            cat "$work/serve.log"
            exit 1
          fi
          echo "answered HTTP $answer; no migration errors; every log line framed"

      - name: Audit (production)
        run: npm audit --omit=dev

      # Informational on purpose: `npm audit` names five advisories in the Vitest/Vite
      # development toolchain, accepted as PROD-6 rather than forcing a breaking
      # test-runner upgrade. Shown, not gated.
      - name: Audit (development toolchain)
        continue-on-error: true
        run: npm audit

      # The product is a generic intake console: no school, exam board or subject identity
      # may reappear in code. README lists this as a verification command; here it is a gate.
      - name: No subject-matter identity strings in src
        run: |
          if rg -qi 'riara|kcse|kcpe|igcse|admission' src; then
            echo "::error::src/ contains subject-matter identity strings"
            rg -in 'riara|kcse|kcpe|igcse|admission' src | head -20
            exit 1
          fi

      - name: No whitespace errors in the change
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
